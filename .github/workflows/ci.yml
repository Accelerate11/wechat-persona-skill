name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -B -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/runtime.test.mjs
      - run: python -B scripts/demo.py
      - run: python -B scripts/chat.py --project .demo/project.json --message Coffee --offline
      - run: python -B scripts/check_public.py
